# Render Blueprint. In the Render dashboard: New -> Blueprint -> select this repo.
# Render finds this file automatically and provisions the service below.
# Database is Neon, not Render Postgres, so no `databases:` block here.
services:
  - type: web
    name: bug-bounty-platform
    runtime: node
    plan: free
    region: singapore
    branch: main
    # --include=dev overrides NODE_ENV=production for this install: the build needs
    # typescript and the @types/* packages, even though the running server doesn't.
    buildCommand: npm ci --include=dev && npm run build
    # migrate deploy only applies pending migrations, so it's safe to run on every boot.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection strings (see README > Setup). sync: false means Render prompts
      # for the value in its dashboard instead of storing it in this file.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_SUCCESS_URL
        sync: false
      - key: PAYMENT_CANCEL_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Optional. Leave unset in the dashboard to run without them.
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
